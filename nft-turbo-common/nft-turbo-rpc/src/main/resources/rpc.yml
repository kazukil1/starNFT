dubbo:
  consumer:
    # 3000
    timeout: 300000
    check: false  # 检查调用服务所依赖的服务有没有启动
  protocol:
    name: dubbo
    port: -1
  registry:
    address: nacos://192.168.150.101:8848
    parameters:
      namespace: dubbo_server  # 自己到nacos上创建一个给dubbo用的namespce，然后和这里保持一致，首次启动前务必修改成你自己的
      group: dubbo #首次启动前务必修改成你自己的
  application:
    name: ${spring.application.name}
    qos-enable: true
    qos-accept-foreign-ip: false

