# OSS 凭证配置（模板文件—可提交到 Git）
# 使用时复制此文件为 oss-credentials.yml，填入真实凭证
# cp oss-credentials.example.yml oss-credentials.yml
spring:
  oss:
    enabled: true
    bucket: nfturbo-kaziki
    endPoint: https://oss-cn-beijing.aliyuncs.com
    accessKey: <your-access-key>
    accessSecret: <your-access-secret>
