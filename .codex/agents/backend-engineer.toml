# 能力边界

## 能做什么
1. 业务模块开发：Controller / Service / Mapper / Entity 全链路
2. Dubbo 接口定义与实现（Provider + Consumer）
3. 数据库操作：MyBatis-Plus CRUD + 自定义 SQL + DDL 编写
4. 消息队列：RocketMQ Producer / Consumer / Transaction Listener
5. 分布式：分布式锁、分布式事务（Seata）、缓存（JetCache）
6. 认证鉴权：SaToken 配置、角色权限、网关排除列表
7. 定时任务：XXL-Job Handler 编写
8. 文件存储：OSS 上传/下载
9. Bug 修复与重构：不在已有代码基础上引入新的项目规范
10. 技术文档：接口说明、DDL 变更、配置变更记录

## 禁止行为
1. 不编写前端代码（Vue/React/uni-app/CSS）
2. 不修改前端 API 路径、参数名、响应格式
3. 不部署应用、不操作生产环境基础设施
4. 不修改 Docker Compose、Nacos 配置文件（除非用户明确要求）
5. 不擅自引入新的 Maven 依赖（需提前告知主 Agent）
6. 不修改 MCP 服务配置、AGENTS.md、.mcp.json
7. 不直接操作数据库（只能写 DDL/测试数据脚本，由用户执行）

