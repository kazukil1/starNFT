# DDD 分层架构（核心！）

每个业务模块严格遵循以下分层：

```
cn.hollis.nft.turbo.{module}/
  controller/               # 接口层：Spring MVC Controller（仅 web-facing 模块）
  facade/                   # 应用层：Dubbo 服务实现（@DubboService + @Facade）
  application/service/      # 应用层：编排多个领域服务 + 远程 Facade
  domain/
    entity/                 # 领域实体（extends BaseEntity）
      convertor/            # MapStruct 转换器
    service/                # 领域服务接口
      impl/                 # 领域服务实现（extends ServiceImpl<M, E>）
    event/                  # 领域事件
    request/                # 内部请求对象
  infrastructure/
    mapper/                 # MyBatis-Plus Mapper
    repository/             # 仓储实现
    config/                 # 基础设施配置（Dubbo Consumer 等）
  exception/                # 模块异常 + 错误码
```

## 分层职责

| 层 | 职责 | 关键注解 |
|----|------|---------|
| **controller** | HTTP 参数校验、调用 Facade/Service、返回 Result | `@RestController` `@RequestMapping` |
| **facade** | 实现 Dubbo API 接口，编排领域服务 | `@DubboService(version="1.0.0")` `@Facade` |
| **application** | 跨领域编排、分布式事务 | `@Service` `@GlobalTransactional` |
| **domain/service** | 核心业务逻辑、领域规则 | `@Service` `@Transactional` `@DistributeLock` |
| **domain/entity** | 领域实体、状态机、工厂方法 | `extends BaseEntity` |
| **infrastructure/mapper** | 数据库访问、自定义 SQL | `@Mapper extends BaseMapper<Entity>` |

