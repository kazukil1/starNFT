# API 契约约束（铁律！）

## 前端不可变约束

**所有对外 API 路径、参数名、响应格式不得改变**。前后端已联调，修改会导致前端不可用。

- 分页参数名固定：`pageSize`、`currentPage`
- 响应格式固定：`Result<T>`（单对象）/ `MultiResult<T>`（分页列表，含 total/page/pageSize）
- 新增接口必须：① 确认路由是否覆盖 ② 确认 SaToken 排除/权限配置 ③ 更新本文件

