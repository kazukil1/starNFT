# 网关与认证

## 路由规则（Gateway）

| 前缀 | 目标服务 |
|------|---------|
| `/auth/**` `/token/**` | `nfturbo-auth` |
| `/trade/**` `/order/**` `/user/**` `/collection/**` `/box/**` `/wxPay/**` | `nft-turbo-business` |

## SaToken 认证规则

**登录排除（公开接口）**：
`/auth/**`、`/collection/collectionList`、`/collection/collectionInfo`、`/box/boxList`、`/box/boxInfo`、`/wxPay/**`

**权限校验**：

| 路径 | 权限要求 |
|------|---------|
| `/admin/**` | `ADMIN` 角色 |
| `/trade/**` | `AUTH` 权限（实名认证） |
| `/user/**` `/order/**` | `BASIC` 或 `FROZEN` 权限 |

- Token 名：`satoken`，超时 30 天
- 新增接口必须检查：① 是否需要登录 ② 需要什么角色/权限

