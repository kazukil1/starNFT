# 编码规范

## 1. 包名与命名

- 包名：`cn.hollis.nft.turbo.{module}.{layer}`
- 类名大驼峰：`TradeController`、`OrderCreateRequest`
- 方法名小驼峰：`createCollection`、`pageQueryByState`
- 常量：`UPPER_SNAKE_CASE`
- Controller 路径：`@RequestMapping("{module}")`

## 2. Controller 规范

```java
@Slf4j
@RequiredArgsConstructor
@RestController
@RequestMapping("trade")
public class TradeController {

    // 注入 Dubbo Facade 或 Domain Service
    @Autowired
    private OrderFacadeService orderFacadeService;

    // GET：参数单独接收
    @GetMapping("/orderList")
    public MultiResult<OrderVO> orderList(
        @NotBlank String state,
        String keyword,
        int pageSize,
        int currentPage
    ) { ... }

    // POST：@Valid + @RequestBody
    @PostMapping("/buy")
    public Result<String> buy(@Valid @RequestBody BuyParam buyParam) { ... }

    // 获取当前用户
    private String getUserId() {
        return (String) StpUtil.getLoginId();
    }
}
```

**分页参数固定**：`pageSize` + `currentPage`（不是 `pageNum`）

## 3. Domain Entity 规范

```java
@Getter @Setter
public class BlindBox extends BaseEntity {
    private String name;
    private BigDecimal price;
    private Long quantity;
    private BlindBoxStateEnum state;
    // ...

    // 工厂方法封装创建逻辑
    public static BlindBox create(BlindBoxCreateRequest request) { ... }

    // 领域方法封装状态变更
    public void confirmSale(Long occupiedInventory) { ... }
}
```

- 实体必须 extends `BaseEntity`（id/deleted/lockVersion/gmtCreate/gmtModified）
- 使用 `@Getter @Setter`（Lombok）
- 工厂方法和领域行为封装在实体中
- MapStruct Convertor 做 Entity ↔ VO 转换

## 4. Domain Service 规范

```java
public interface BlindBoxService extends IService<BlindBox> {
    BlindBox create(BlindBoxCreateRequest request);
    Boolean sale(GoodsTrySaleRequest request);
    BlindBox queryById(Long blindBoxId);
    PageResponse<BlindBox> pageQueryByState(...);
}

@Service
public class BlindBoxServiceImpl extends ServiceImpl<BlindBoxMapper, BlindBox>
        implements BlindBoxService {

    @Autowired
    private BlindBoxMapper blindBoxMapper;

    @Override
    @Transactional(rollbackFor = Exception.class)
    public BlindBox create(BlindBoxCreateRequest request) { ... }

    // 流水模式：查询 → 写流水 → 核心操作
    @Override
    @Transactional(rollbackFor = Exception.class)
    public Boolean sale(GoodsTrySaleRequest request) {
        // 1. 流水校验（幂等）
        BlindBoxInventoryStream existStream = mapper.selectByIdentifier(...);
        if (existStream != null) return true;
        // 2. 最新数据
        BlindBox blindBox = this.getById(request.goodsId());
        // 3. 写流水
        mapper.insert(new BlindBoxInventoryStream(blindBox, ...));
        // 4. 核心操作
        return blindBoxMapper.sale(request.goodsId(), request.quantity()) > 0;
    }

    // 缓存
    @Cached(name = ":blindBox:cache:id:", expire = 60, timeUnit = TimeUnit.MINUTES,
            cacheType = CacheType.BOTH, key = "#blindBoxId")
    public BlindBox queryById(Long blindBoxId) { ... }
}
```

- Service 接口 extends `IService<Entity>`
- ServiceImpl extends `ServiceImpl<Mapper, Entity>` implements Service
- **库存操作必须使用「流水模式」**：先校验幂等 → 写流水 → 再操作
- 分布式锁：`@DistributeLock(keyExpression = "#request.id", scene = "XXX")`
- 缓存：JetCache `@Cached` / `@CacheInvalidate`

## 5. Mapper 规范

```java
@Mapper
public interface BlindBoxMapper extends BaseMapper<BlindBox> {
    BlindBox selectByIdentifier(String identifier);

    // 库存操作：返回 int（受影响行数），配合乐观锁
    int sale(Long id, Long quantity);
    int cancel(Long id, Long quantity);
    int freezeInventory(Long id, Long quantity);
    int unfreezeInventory(Long id, Long quantity);
}
```

- extends `BaseMapper<Entity>` 获得标准 CRUD
- SQL 方法返回 `int` 配合乐观锁判断

## 6. Dubbo 契约规范

**API 定义（nft-turbo-api 模块）**：

```java
// 接口定义在 nft-turbo-api 模块中
public interface CollectionManageFacadeService {
    CollectionChainResponse create(CollectionCreateRequest request);
    CollectionAirdropResponse airDrop(CollectionAirDropRequest request);
}
```

**Facade 实现（业务模块 facade 层）**：

```java
@Slf4j
@DubboService(version = "1.0.0")
public class CollectionManageFacadeServiceImpl implements CollectionManageFacadeService {
    @Autowired
    private CollectionService collectionService;

    @Override
    @Facade  // 自定义注解，AOP 日志/指标
    public CollectionChainResponse create(CollectionCreateRequest request) { ... }
}
```

**Dubbo Consumer 注入（infrastructure/config）**：

```java
@Configuration
public class PayDubboConfiguration {
    @DubboReference(version = "1.0.0")
    private CollectionReadFacadeService collectionReadFacadeService;

    @Bean
    @ConditionalOnMissingBean(name = "collectionFacadeService")
    public CollectionReadFacadeService collectionFacadeService() {
        return collectionReadFacadeService;
    }
}
```

- 所有 Dubbo 版本统一 `"1.0.0"`
- API 接口和 DTO 定义在 `nft-turbo-common/nft-turbo-api/`
- 消费者用 `@DubboReference` + `@Bean` + `@ConditionalOnMissingBean` 包装

## 7. RocketMQ 规范

**生产者**：

```java
@Autowired
private StreamProducer streamProducer;

// 普通消息
streamProducer.send("newBuy-out-0", tag, JSON.toJSONString(request));

// 延迟消息（RocketMQ delay level: 1s/5s/10s/30s/1m/...）
streamProducer.send("orderClose-out-0", tag, json, delayLevel);
```

**消费者**：

```java
@Component
@ConditionalOnProperty(value = "rocketmq.broker.check", havingValue = "false", matchIfMissing = true)
public class NewBuyMsgListener extends AbstractStreamConsumer {

    @Autowired
    private OrderFacadeService orderFacadeService;

    @Bean
    Consumer<Message<MessageBody>> newBuy() {
        return msg -> {
            OrderCreateRequest request = getMessage(msg, OrderCreateRequest.class);
            // 处理业务
        };
    }
}
```

- 使用 Spring Cloud Stream Functional 风格（`@Bean Consumer<Message<MessageBody>>`）
- 继承 `AbstractStreamConsumer` 获得 `getMessage()` 工具方法
- 消息体是 `MessageBody`（含 identifier + body）

## 8. 异常处理

```java
// 业务异常
throw new BusinessException(ErrorCode.XXX, "参数非法");

// 全局异常码定义在模块 exception 包中
public enum ErrorCode {
    PARAM_ERROR("PARAM_ERROR", "参数错误"),
    INVENTORY_NOT_ENOUGH("INVENTORY_NOT_ENOUGH", "库存不足"),
    ...
}
```

