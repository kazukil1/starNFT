# ⚠️ 已知陷阱（必读）

## luch-request（uview-plus 3.x 的 HTTP 模块）

### 1. `setConfig` 接受回调函数，不是对象
```typescript
// ❌ 错误
http.setConfig({ baseURL: 'http://...' });
// ✅ 正确
http.setConfig((config: any) => {
    config.baseURL = 'http://...';
    return config;
});
```

### 2. 字段名是 `baseURL`（大写 URL），不是 `baseUrl`
```typescript
config.baseURL = baseUrl;  // 注意大写 URL
```

### 3. 拦截器 API：`interceptors.request.use(fn)` 不是 `interceptor.request = fn`
```typescript
// ❌ 错误
http.interceptor.request = (config) => { ... };
// ✅ 正确
http.interceptors.request.use((config) => { ... });
http.interceptors.response.use((res) => { ... });
```

### 4. `mergeConfig` 白名单机制（重要！）
luch-request 内部 `mergeConfig` 只保留已知配置字段（baseURL/method/url/params/header/data/timeout/responseType 等），**平铺的业务参数（pageSize/currentPage/state/keyword）会被丢弃**。

**必须通过 `normalizeOptions()` 将平铺参数提前转换为 `{ params: {...} }` 格式**，否则后端收不到参数。

当前 `src/common/http.interceptor.ts` 已 monkey-patch `http.get/post/delete` 处理此问题，**页面代码无需特殊处理**，直接平铺传参即可：
```typescript
// 页面代码这样写即可（monkey-patch 会自动转换）
uni.$u.http.get('/collection/collectionList', {
    pageSize: 5,
    currentPage: 1,
    state: 'SUCCEED',
});
```

### 5. uview-plus 3.x 组件 API 变化
- `u-notice-bar`: `mode="vertical"` → `direction="column"`
- 其他组件 props 可能也有变化，参考 uview-plus 3.x 文档

