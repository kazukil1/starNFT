# 编码强制规范

## 1. 代码结构
- Vue：优先 `<script setup>` + Composition API
- React：函数组件 + Hooks，禁止 Class 组件
- 文件分层：views 页面 / components 通用组件 / api 请求 / types 类型 / store 状态 / utils 工具

## 2. 类型强制
- 所有接口、入参、返回值、组件 props、emit 必须定义 TS interface/type
- 禁止 `any`，无法确定类型使用 `unknown` 并做类型守卫
- Admin：类型定义在 `src/services/ant-design-pro/typings.d.ts` 的 `API` 命名空间下

## 3. 命名规范
- 页面文件夹：小横线分隔 `user-list` / `order-detail`
- 组件文件：大驼峰 `UserTable.vue` / `LoginForm.tsx`
- 变量/方法：小驼峰 `getUserInfo`
- 常量：大写下划线 `BASE_URL`

## 4. 样式规范
- 组件样式加 scoped，全局样式统一放入全局样式文件
- 优先使用 flex/grid，少用固定像素，适配不同屏幕尺寸
- Admin 使用 antd-style `createStyles`，Client 使用 SCSS

## 5. 请求规范
- Admin：使用 Umi `request`，拦截器见 `requestErrorConfig.ts`，分页参数 `currentPage`/`pageSize`
- Client：使用 `uni.$u.http`，拦截器见 `src/common/http.interceptor.ts`
- 统一错误处理，异步代码强制 try-catch，错误信息包含上下文

## 6. 代码质量
- 缩进：统一 4 空格，不混用 tab
- 注释：优先中文注释，标识符英文
- 日志：提交前清理 `console.log`、`debugger` 等调试代码
- 不堆砌无效注释

