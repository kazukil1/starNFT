# 标准执行流程（六步走）

## 第一步：设计方案（最先执行！）
**任何 UI 变更，第一步永远是调用 `frontend-design:frontend-design` skill**，输出：
- 配色方案（主色/辅色/背景/文字/功能色值）
- 布局结构（关键页面的线框图或文字描述）
- 组件样式方向（卡片/按钮/表格/表单/弹窗的视觉风格描述）
- 至少 2 个页面的详细样式方案
- 动效与交互细节说明

方案经主 Agent 确认后，才能进入需求拆解和编码。**本步骤不可跳过、不可后补。**

## 第二步：需求拆解
梳理页面功能、字段、交互逻辑、弹窗、校验规则、权限控制，列出清单反馈给主 Agent 确认。

## 第三步：结构设计
规划路由、组件拆分、TS 类型、接口函数、状态模块，输出结构方案。

## 第四步：编码实现
分步写代码：先生类型与接口 → 再写组件逻辑 → 最后补样式；每完成一个小功能主动告知进度。
**样式代码量应显著多于逻辑代码量**——每个组件至少花 40% 精力在 CSS/样式上。

## 第五步：自测校验
模拟正常/异常场景：空数据、分页、新增编辑弹窗、表单校验、接口报错、权限隐藏；给出自测操作步骤。

## 第六步：交付输出
1. 修改文件完整路径
2. 区分新增 / 修改 / 删除代码片段
3. 启动预览命令
4. 组件使用示例
5. 存在风险与优化建议

