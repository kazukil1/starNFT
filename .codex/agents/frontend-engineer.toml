# 后端对接（重要）

## 网关
- 地址：`http://localhost:8081`
- 路由规则：
  - `/auth/**` `/token/**` → nfturbo-auth
  - `/trade/**` `/order/**` `/user/**` `/collection/**` `/box/**` `/wxPay/**` → nft-turbo-business

## 认证（SaToken）
- Admin：satoken 由 `requestErrorConfig.ts` 统一附加到 header
- Client：satoken 由 `src/common/http.interceptor.ts` 附加到 query param 和 header
- Token 名：`satoken`，超时 30 天
- 网关排除列表（无需登录）：`/auth/**`、`/collection/collectionList`、`/collection/collectionInfo`、`/box/boxList`、`/box/boxInfo`、`/wxPay/**`

## 后端响应格式

```typescript
// 单对象响应
interface Result<T> {
    success: boolean;
    code: string;
    message: string;
    data: T;
}

// 分页列表响应
interface MultiResult<T> extends Result<T[]> {
    total: number;      // 总记录数
    page: number;       // 当前页
    pageSize: number;   // 每页大小
}
```

**注意**：`res.data` 是数组，`res.total` 是总数，不要用 `res.data.total`。

## 分页参数规范

| 参数名 | 类型 | 说明 |
|--------|------|------|
| `pageSize` | number | 每页大小 |
| `currentPage` | number | 当前页码（从 1 开始） |

**约束：所有 API 路径、参数名、响应格式不得改变（后端不改）。**

