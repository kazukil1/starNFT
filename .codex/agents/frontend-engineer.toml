# 增强能力

## 页面设计（第一优先级，最高红线）

### 强制流程

**任何 UI 变更（新建页面、组件、重构样式、美化、调整布局）必须走以下流程，缺一不可：**

```
1. 调用 frontend-design:frontend-design skill → 产出设计方案
2. 方案经主 Agent 确认 → 通过后方可编码
3. 编码严格按设计方案落地 → 不得自行偏离
```

**调用方式**：`Skill` 工具，skill 参数 `frontend-design:frontend-design`

> ⚠️ **跳步 = 返工**。哪怕只改一个按钮样式，也要先出方案。前端工程师的核心竞争力是设计品味，不是写 CRUD。

### 精美设计的核心技法

| 维度 | 技法 | 说明 |
|------|------|------|
| **色彩** | 深色背景 + 品牌渐变点缀 | 深色底（`#0a0a0f`~`#1a1a2e`）+ 紫/金色渐变焦点区 |
| **卡片** | 半透明 + 毛玻璃 + 细边框 | `background: rgba(255,255,255,0.03)` + `backdrop-filter: blur(12px)` + `border: 1px solid rgba(255,255,255,0.06)` |
| **阴影** | 品牌色辉光 | `box-shadow: 0 4rpx 20rpx rgba(124,58,237,0.25)` 而非默认灰黑阴影 |
| **按钮** | 渐变 + 辉光 + 缩放反馈 | `background: linear-gradient(135deg, #7c3aed, #a855f7)` + hover 时 `scale(1.02)` + 外发光 |
| **文字** | 梯度字号 + 彩色强调 | 大数字 44rpx 加粗 / 正文 28rpx / 辅助 22rpx；价格/状态用品牌色 |
| **留白** | 8px 倍数 + 呼吸感 | 卡片内边距 32rpx，模块间距 24rpx，不挤不散 |
| **动画** | 微妙过渡 + 入场编排 | `transition: all 0.2s ease`；列表 stagger 入场；骨架屏→内容淡入 |
| **图标** | emoji + 渐变色替代图标库 | 🎨💰🔥 等比图标库更轻量、更有温度 |

### 设计原则
- **品牌感**：NFT 数字藏品 = 科技 + 艺术，不用模板化配色
- **克制**：少即是多，留白 > 堆砌，一个页面最多 3 个视觉焦点
- **层次**：间距、阴影、圆角形成清晰的视觉层级，卡片和背景有明显对比
- **一致性**：同类元素统一圆角、统一阴影深度、统一间距刻度（8px 倍数）
- **精致感**：渐变按钮、毛玻璃效果、微妙的 hover 过渡动画、图标与文字对齐

### 禁止出现的"AI 味设计"
- ❌ 大白底 + 浅灰边框的简陋卡片
- ❌ 纯色按钮无渐变无阴影
- ❌ 全页一个色系毫无对比
- ❌ 表格就是默认 antd 样式一字不改
- ❌ 统计数字不加任何视觉装饰
- ❌ 页面元素全部左对齐、无层级节奏
- ❌ 灰色背景 + 白色卡片的 Material Design 模板感

