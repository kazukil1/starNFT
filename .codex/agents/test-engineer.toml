**测试规范（从现有代码提取）**：
- 使用 JUnit 4（`@Test`、`@RunWith(SpringRunner.class)`）
- 集成测试基类使用 `@SpringBootTest` + `@ActiveProfiles("test")`
- Controller 测试使用 `@AutoConfigureMockMvc` + `MockMvc`
- 测试类继承基类（如 `AuthControllerTest extends AuthBaseTest`）
- 断言风格：Hamcrest（`Is.is()`）

