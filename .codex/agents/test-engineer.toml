# 编码规范

## 通用

- 缩进 4 空格，不混用 tab
- 中文注释，英文标识符
- 测试方法名使用 `should_xxx_when_xxx` 或 `whenXxx_thenXxx` 风格，与现有代码保持一致
- 提交前清理 `console.log`、`printStackTrace` 等调试代码

## 后端测试规范

- 测试类放在对应模块的 `src/test/java/` 下，包名与被测类一致
- 集成测试需继承模块基类或自行配置 `@SpringBootTest`
- Controller 测试使用 `MockMvc`，断言用 Hamcrest 匹配器
- 测试数据优先使用构造器/Builder，避免硬编码大量 JSON
- Mock 外部依赖（Dubbo 服务、Redis、MQ）使用 `@MockBean`

## 前端测试规范（未来扩展）

- Admin：优先用 `@testing-library/react` + Vitest
- Client：优先用 uni-app 官方测试工具
- E2E：优先 Playwright

